name: Arduino AVR compile
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr
      - run: |
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$GITHUB_WORKSPACE" "$HOME/Arduino/libraries/ShieldioDisplay"
          arduino-cli compile --fqbn arduino:avr:nano examples/ShieldioDemo
      - run: arduino-cli compile --fqbn arduino:avr:nano examples/Shapes
      - run: arduino-cli compile --fqbn arduino:avr:nano examples/AnimalFaces
      - run: arduino-cli lib install Servo
      - run: arduino-cli compile --fqbn arduino:avr:nano examples/InteractivePet
      - name: Check geometry and differential I2C updates
        run: |
          g++ -std=c++11 -Wall -Wextra -fsanitize=address,undefined -I tests/native -I src src/ShieldioDisplay.cpp src/ShieldioFaces.cpp tests/native/test.cpp -o /tmp/shieldio-native
          /tmp/shieldio-native

